# Generated by script/prepare-git.ts; edit source manifests instead.
[package]
name = "gpui-fast-wgpu"
version = "0.1.10"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-fast"
homepage = "https://github.com/longbridge/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/gpui-fast-wgpu/0.1.10/gpui_wgpu/"
description = "gpui_wgpu: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/gpui_wgpu.rs"
doctest = false
name = "gpui_wgpu"

[features]
default = ["webgpu", "webgl"]
webgpu = ["wgpu/webgpu", "wgpu/wgsl"]
webgl = ["wgpu/webgl", "wgpu/wgsl"]
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
cosmic-text = "0.19.0"

[dependencies.gpui]
default-features = false
package = "gpui-fast"
version = "^0.1.10"
path = "../gpui"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bytemuck]
version = "1"

[dependencies.collections]
version = "=0.3.9"
package = "gpui-pre-collections"

[dependencies.etagere]
version = "0.2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["png"]
optional = true

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.profiling]
version = "1"

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.swash]
version = "0.2.6"

[dependencies.unicode-bidi]
version = "0.3.18"
default-features = false
features = ["hardcoded-data"]

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.gpui_util]
package = "gpui-pre-util"
version = "=0.3.9"

[dependencies.font-kit]
package = "zed-font-kit"
version = "0.14.1-zed"
default-features = false
optional = true

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\"))".dependencies.wgpu]
default-features = false
features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"]
version = "=30.0.1"
git = "https://github.com/brookqin/wgpu.git"
rev = "35f8c66e67f15b5321fcfb3396d99653446c86b2"

[target."cfg(not(any(target_family = \"wasm\", target_os = \"linux\", target_os = \"freebsd\")))".dependencies.wgpu]
default-features = true
version = "=30.0.1"
git = "https://github.com/brookqin/wgpu.git"
rev = "35f8c66e67f15b5321fcfb3396d99653446c86b2"

[target."cfg(target_family = \"wasm\")".dependencies.wasm-bindgen]
version = "0.2.120"

[target."cfg(target_family = \"wasm\")".dependencies.js-sys]
version = "0.3"

[target."cfg(target_family = \"wasm\")".dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "HtmlVideoElement", "HtmlMediaElement", "Window", "Event", "EventTarget"]

[target."cfg(target_family = \"wasm\")".dependencies.wgpu]
default-features = false
features = ["std"]
version = "=30.0.1"
git = "https://github.com/brookqin/wgpu.git"
rev = "35f8c66e67f15b5321fcfb3396d99653446c86b2"

[lints.rust.unexpected_cfgs]
level = "allow"
